{% extends "base.html" %}

{% block title %}404 - Page Not Found{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row">
        <div class="col-lg-8 mx-auto">
            <div class="error-page text-center">
                <h1 class="display-1 text-danger fw-bold" style="font-family: 'Orbitron', sans-serif;">404</h1>
                <h2 class="text-light mb-4">Page Not Found</h2>
                <p class="text-muted mb-4">The battle arena you're looking for doesn't exist.</p>
                <a href="/" class="btn btn-danger btn-lg">
                    <i class="fas fa-home"></i> Back to Home
                </a>
            </div>
        </div>
    </div>
</div>

<style>
    .error-page {
        padding: 60px 20px;
        animation: slideUp 0.6s ease;
    }
</style>
{% endblock %}
